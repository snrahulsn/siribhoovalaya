<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://siribhoovalaya.goatcounter.com; media-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://siribhoovalaya.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Read the poem · Siribhūvalaya</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=5">
<style>
.top{padding-block:56px 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ch{display:flex;flex-direction:column;gap:10px;padding:20px;border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none;min-height:150px;transition:border-color .15s,transform .15s}
.ch:hover{border-color:var(--accent);transform:translateY(-2px)}
.ch .n{font-family:var(--mono);font-size:13px;color:var(--accent)}
.ch .t{font-size:15px;line-height:1.5;color:var(--fg)}
.ch .go{margin-top:auto;font-size:14px;color:var(--accent)}
.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 20px;border:1px solid var(--line);border-radius:10px;margin-bottom:28px;font-size:15px}
.note .btn{margin-left:auto}
.box{display:flex;max-width:640px;margin-bottom:20px}
.box input{flex:1;font:inherit;font-size:16px;padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.hint{font-size:14px;color:var(--muted);margin:-8px 0 16px}
.res{border-top:1px solid var(--line);margin-bottom:32px}
.hit{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.hit:hover .en{color:var(--accent)}
.hit .where{font-family:var(--mono);font-size:13px;color:var(--accent)}
.hit .kn{font-size:18px;line-height:1.7;word-break:break-word}
.hit .en{font-size:15px;color:var(--muted);margin-top:6px}
mark{background:var(--accent-soft);color:var(--accent);padding:0 2px;border-radius:2px}
@media (max-width:560px){.hit{grid-template-columns:1fr;gap:4px}}
</style>
</head>
<body>
<main>
  <div class="frame top">
    <p class="eyebrow">Read the poem</p>
    <h1>59 chapters</h1>
    <p class="lede" style="max-width:760px">Pick a chapter. Each one opens with every verse in Kannada and a rough English translation underneath.</p>
  </div>
  <div class="frame">
    <div class="note"><span>The chapter summaries and the English translations are machine-written first drafts and are often wrong. If you read Old Kannada, you can correct them.</span><a class="btn" href="help.html">How to correct</a></div>
    <div class="box"><input id="q" type="search" placeholder="Find a word in any verse, in Kannada or English"></div>
    <p class="hint" id="hint" hidden></p>
    <div class="res" id="res" hidden></div>
    <div class="grid" id="grid"></div>
  </div>
</main>
<script src="layout.js?v=5"></script>
<script>
fetch('data/chapters.json').then(r => r.json()).then(C => {
  const g = document.getElementById('grid');
  C.forEach(ch => {
    const a = document.createElement('a'); a.className = 'ch'; a.href = 'chapter.html?c=' + ch.c;
    a.innerHTML = '<span class="n"></span><span class="t"></span><span class="go">Read →</span>';
    a.querySelector('.n').textContent = 'Chapter ' + ch.c + ' · ' + ch.lines + ' verses';
    a.querySelector('.t').textContent = ch.s;
    g.appendChild(a);
  });
});
let IDX = null, loading = false; const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mark(text, q) { const i = text.toLowerCase().indexOf(q); if (i < 0) return esc(text); return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length)); }
function run() {
  const q = $('q').value.trim().toLowerCase(), res = $('res'), hint = $('hint'); res.textContent = '';
  const on = q.length >= 2; res.hidden = hint.hidden = !on; $('grid').hidden = on; if (!on) return;
  if (!IDX) { hint.textContent = 'Loading…'; if (!loading) { loading = true; fetch('data/search_index.json').then(r => r.json()).then(d => { IDX = d; run(); }); } return; }
  const hits = []; for (const h of IDX) { if (h[2].includes(q) || h[3].toLowerCase().includes(q)) { hits.push(h); if (hits.length >= 200) break; } }
  hint.textContent = hits.length ? (hits.length >= 200 ? 'First 200 verses' : hits.length + ' verse' + (hits.length === 1 ? '' : 's')) : 'No verses found.';
  hits.forEach(([c, n, kn, en]) => { const a = document.createElement('a'); a.className = 'hit'; a.href = 'chapter.html?c=' + c + '#v' + n;
    a.innerHTML = `<span class="where">Chapter ${c} · verse ${n}</span><span><div class="kn">${mark(kn, q)}</div><div class="en">${mark(en, q)}</div></span>`; res.appendChild(a); });
}
$('q').addEventListener('input', run);
</script>
</body>
</html>
